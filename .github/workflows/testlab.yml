name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: [self-hosted, testlab]
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Run tests
        run: .venv/bin/pytest --junitxml=results.xml
        continue-on-error: true

      - name: Publish test results to Test Lab
        if: always()
        run: |
          curl -sS --fail-with-body -X POST https://durango-dms.andolasoft.co.in/test-lab/api/automation/results \
            -H "Authorization: Bearer ${{ secrets.TESTLAB_TOKEN }}" \
            -F project_id="${{ vars.TESTLAB_PROJECT_NAME }}" \
            -F name="CI #${{ github.run_number }}" \
            -F source_ref="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -F junit=@results.xml
