name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest --junitxml=results.xml
        continue-on-error: true

      - name: Publish test results to Test Lab
        if: always()
        run: |
          curl -sS --fail-with-body -X POST https://durango-dms.andolasoft.co.in/test-lab/api/automation/results \
            -H "Authorization: Bearer ${{ secrets.TESTLAB_TOKEN }}" \
            -F project_id=${{ vars.TESTLAB_PROJECT_ID }} \
            -F name="CI #${{ github.run_number }}" \
            -F source_ref="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -F junit=@results.xml
